<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Rezepte &amp; Essensplan</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-2: #1f242d;
      --border: #2c3340;
      --text: #f4f6f8;
      --muted: #9aa4b2;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --ok: #22c55e;
      --star: #facc15;
      --nav-h: 64px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    body {
      padding-bottom: calc(var(--nav-h) + 20px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(15, 17, 21, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-heading {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row-split {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 640px) {
      .filter-bar {
        grid-template-columns: 1.4fr 1fr;
      }
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select, button {
      font-family: inherit;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      min-height: 46px;
      padding: 10px 12px;
      color: var(--text);
      background: var(--surface-2);
    }

    input, select { width: 100%; }

    input.num-input {
      width: 88px;
      min-width: 88px;
      text-align: center;
    }

    button {
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-ghost {
      min-height: 38px;
      padding: 6px 12px;
      font-size: 14px;
      background: var(--surface-2);
    }

    .btn-danger {
      min-height: 38px;
      padding: 6px 12px;
      font-size: 14px;
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
      word-break: break-word;
    }

    .status.ok { color: var(--ok); }
    .status.err { color: #f87171; }

    .day-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .day-card.today { border-color: var(--accent); }

    .day-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .day-card.today .day-date { color: #93c5fd; }

    .empty-day {
      font-size: 14px;
      color: var(--muted);
      opacity: 0.75;
    }

    .meal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 6px;
    }

    .meal-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .meal-del {
      width: 34px;
      min-width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      font-size: 18px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      border-color: rgba(252, 165, 165, 0.45);
      color: #fca5a5;
    }

    .recipe-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .recipe-card:hover, .recipe-card.selected {
      border-color: var(--accent);
    }

    .recipe-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
      display: block;
      background: var(--surface);
    }

    .detail-hero {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      display: none;
      background: var(--surface-2);
    }

    .recipe-name {
      font-size: 16px;
      font-weight: 700;
    }

    .recipe-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .stars-display {
      color: var(--star);
      font-size: 14px;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .stars-picker {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .star-btn {
      min-height: 38px;
      padding: 4px 10px;
      font-size: 18px;
      line-height: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .star-btn.active {
      color: var(--star);
      border-color: rgba(250, 204, 21, 0.55);
      background: rgba(250, 204, 21, 0.12);
    }

    .detail-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      white-space: pre-line;
      font-family: inherit;
      font-size: 15px;
      margin: 6px 0 12px 0;
    }

    .steps-box {
      line-height: 1.65;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--nav-h);
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      min-height: var(--nav-h);
      padding: 6px 4px;
      flex-direction: column;
      gap: 2px;
    }

    .nav-btn.active {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.12);
    }

    @media (min-width: 768px) {
      body { padding-bottom: 24px; }
      .bottom-nav { display: none; }
      .desktop-tabs { display: flex; gap: 8px; }
      .tab-btn {
        min-height: 38px;
        padding: 6px 14px;
        font-size: 14px;
        background: var(--surface-2);
      }
      .tab-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .plan-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .plan-grid .day-card { margin-bottom: 0; }
      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .recipe-grid .recipe-card { margin-bottom: 0; }
    }

    @media (max-width: 767px) {
      .desktop-tabs { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">Rezepte &amp; Plan</div>
    <div class="desktop-tabs">
      <button type="button" class="tab-btn active" data-view="planView">Essensplan</button>
      <button type="button" class="tab-btn" data-view="recipesView">Rezepte</button>
      <button type="button" class="tab-btn" data-view="addView">+ Rezept</button>
    </div>
    <button type="button" id="refreshBtn" class="btn-ghost">Neu laden</button>
  </header>

  <main class="container">
    <div id="statusBar" class="status"></div>

    <section id="planView" class="view active">
      <div class="card">
        <h2 class="card-heading">Essensplan (nächste 14 Tage)</h2>
        <div id="planList" class="plan-grid"></div>
      </div>
    </section>

    <section id="recipesView" class="view">
      <div id="detailCard" class="card" style="display:none;">
        <div class="row-split" style="justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
          <div>
            <h2 id="detailTitle" class="card-heading" style="margin-bottom:4px;"></h2>
            <div id="detailMeta" class="recipe-sub"></div>
          </div>
          <div class="row-split" style="gap:6px;">
            <button type="button" id="closeDetailBtn" class="btn-ghost">Zuklappen</button>
            <button type="button" id="deleteBtn" class="btn-danger">Löschen</button>
          </div>
        </div>

        <img id="detailImage" class="detail-hero" alt="Rezeptbild" />

        <div style="margin-top:8px;">
          <label>Bewertung</label>
          <div id="ratingPicker" class="stars-picker"></div>
        </div>

        <div class="stack" style="margin-top:12px;">
          <div class="row-split">
            <div style="flex:1;">
              <label for="planDate">Datum</label>
              <input type="date" id="planDate" />
            </div>
            <div>
              <label for="planServings">Portionen</label>
              <input type="number" id="planServings" class="num-input" min="1" max="30" value="3" />
            </div>
          </div>
          <button type="button" id="planSaveBtn" class="btn-primary">In Essensplan eintragen</button>
        </div>

        <div class="recipe-sub" style="margin-top:14px;"><strong>Zutaten</strong></div>
        <div id="detailIngredients" class="detail-box"></div>

        <div class="recipe-sub"><strong>Zubereitung</strong></div>
        <div id="detailSteps" class="detail-box steps-box"></div>

        <div class="recipe-sub">
          <a id="detailUrl" href="#" target="_blank" rel="noopener" style="color:#93c5fd;">Originalrezept öffnen</a>
        </div>
      </div>

      <div class="card">
        <h2 class="card-heading">Gespeicherte Rezepte</h2>
        <div class="filter-bar">
          <div>
            <label for="recipeSearch">Suche (Name oder Zutat)</label>
            <input type="search" id="recipeSearch" placeholder="z. B. Pasta, Hähnchen, Tomate..." />
          </div>
          <div>
            <label for="starFilter">Sterne-Filter</label>
            <select id="starFilter">
              <option value="all">Alle Rezepte</option>
              <option value="min3">Mindestens 3 Sterne (3–5)</option>
              <option value="min4">Mindestens 4 Sterne (4–5)</option>
              <option value="5">Genau 5 Sterne</option>
              <option value="4">Genau 4 Sterne</option>
              <option value="3">Genau 3 Sterne</option>
              <option value="2">Genau 2 Sterne</option>
              <option value="1">Genau 1 Stern</option>
              <option value="0">Ohne Bewertung</option>
            </select>
          </div>
        </div>
        <div id="recipeList" class="recipe-grid"></div>
      </div>
    </section>

    <section id="addView" class="view">
      <div class="card">
        <h2 class="card-heading">Neues Rezept per Link</h2>
        <div class="stack">
          <div>
            <label for="recipeUrl">Rezept-URL</label>
            <input type="url" id="recipeUrl" placeholder="https://..." />
          </div>
          <div>
            <label for="recipeServings">Wunsch-Portionen</label>
            <input type="number" id="recipeServings" class="num-input" min="1" max="30" value="3" />
          </div>
          <button type="button" id="addBtn" class="btn-primary">Analysieren &amp; Speichern</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-view="planView"><span>Plan</span></button>
    <button type="button" class="nav-btn" data-view="recipesView"><span>Rezepte</span></button>
    <button type="button" class="nav-btn" data-view="addView"><span>+ Neu</span></button>
  </nav>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyI8ZYz6yJe2Ubay1enh2lAbuQkS8f78T7vE7ZnXrm3yYLjgE1QNyjBV_Zu3aW7sIE/exec';

    let state = { recipes: [], plan: [] };
    let selectedRecipeId = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function setStatus(msg, type = '') {
      const el = document.getElementById('statusBar');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function setBusy(busy) {
      document.getElementById('addBtn').disabled = busy;
      document.getElementById('refreshBtn').disabled = busy;
      document.getElementById('planSaveBtn').disabled = busy;
      document.getElementById('deleteBtn').disabled = busy;
    }

    async function apiGetData() {
      const sep = API_URL.indexOf('?') === -1 ? '?' : '&';
      const res = await fetch(`${API_URL}${sep}action=getData`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    async function apiPostAction(payload) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Aktion fehlgeschlagen.');
      return json.data;
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => {
        v.classList.toggle('active', v.id === viewId);
      });
      document.querySelectorAll('.nav-btn, .tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewId);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.querySelectorAll('.nav-btn, .tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    function toIsoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatStepsWithSpacers(rawSteps) {
      const text = String(rawSteps || '').replace(/\r\n/g, '\n').trim();
      if (!text) return '';
      const blocks = text.split(/\n\s*\n+/);
      if (blocks.length > 1) {
        return blocks.map(b => b.trim()).join('\n\n');
      }
      return text.split('\n').map(line => line.trim()).filter(Boolean).join('\n\n');
    }

    function starsText(rating) {
      const r = Number(rating || 0);
      if (r < 1) return 'Noch nicht bewertet';
      return '★'.repeat(r) + '☆'.repeat(5 - r);
    }

    function renderPlan() {
      const wrap = document.getElementById('planList');
      wrap.innerHTML = '';

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayIso = toIsoDate(today);

      for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const iso = toIsoDate(d);
        const label = d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit'
        });

        const card = document.createElement('div');
        card.className = 'day-card' + (iso === todayIso ? ' today' : '');

        const head = document.createElement('div');
        head.className = 'day-date';
        head.textContent = iso === todayIso ? `${label} (Heute)` : label;
        card.appendChild(head);

        const entries = state.plan.filter(p => p.date === iso);
        if (!entries.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-day';
          empty.textContent = 'Noch nichts geplant';
          card.appendChild(empty);
        } else {
          entries.forEach(p => {
            const row = document.createElement('div');
            row.className = 'meal-row';

            const title = document.createElement('div');
            title.className = 'meal-title';
            title.textContent = `${p.title} (${p.servings} P.)`;
            title.addEventListener('click', () => {
              if (p.recipeId) {
                openRecipe(p.recipeId, true);
                switchView('recipesView');
              }
            });

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'meal-del';
            del.textContent = '×';
            del.addEventListener('click', async ev => {
              ev.stopPropagation();
              setBusy(true);
              try {
                state = await apiPostAction({ action: 'removePlan', planId: p.planId });
                renderPlan();
                setStatus('Eintrag entfernt.', 'ok');
              } catch (err) {
                setStatus(err.message || 'Fehler.', 'err');
              } finally {
                setBusy(false);
              }
            });

            row.appendChild(title);
            row.appendChild(del);
            card.appendChild(row);
          });
        }

        wrap.appendChild(card);
      }
    }

    function matchesStarFilter(rating, filterVal) {
      const r = Number(rating || 0);
      if (filterVal === 'all') return true;
      if (filterVal === 'min3') return r >= 3;
      if (filterVal === 'min4') return r >= 4;
      return r === Number(filterVal);
    }

    function getFilteredRecipes() {
      const query = (document.getElementById('recipeSearch').value || '').trim().toLowerCase();
      const filterVal = document.getElementById('starFilter').value || 'all';

      return state.recipes.filter(r => {
        if (!matchesStarFilter(r.rating, filterVal)) return false;
        if (!query) return true;
        const hay = `${r.title} ${r.ingredients}`.toLowerCase();
        return hay.indexOf(query) !== -1;
      });
    }

    function renderRecipes() {
      const wrap = document.getElementById('recipeList');
      wrap.innerHTML = '';

      const list = getFilteredRecipes();
      if (!list.length) {
        wrap.innerHTML = '<div class="empty-day">Keine passenden Rezepte gefunden.</div>';
        return;
      }

      list.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card' + (r.id === selectedRecipeId ? ' selected' : '');
        card.addEventListener('click', () => toggleRecipe(r.id));

        if (r.imageUrl) {
          const img = document.createElement('img');
          img.className = 'recipe-thumb';
          img.src = r.imageUrl;
          img.alt = r.title;
          img.loading = 'lazy';
          img.onerror = () => { img.style.display = 'none'; };
          card.appendChild(img);
        }

        const name = document.createElement('div');
        name.className = 'recipe-name';
        name.textContent = r.title;

        const stars = document.createElement('div');
        stars.className = 'stars-display';
        stars.textContent = starsText(r.rating);

        const sub = document.createElement('div');
        sub.className = 'recipe-sub';
        const last = r.lastEaten ? ` • Zuletzt: ${r.lastEaten}` : '';
        sub.textContent = `${r.servings} Port. • ${r.durationMin} Min.${last}`;

        card.appendChild(name);
        card.appendChild(stars);
        card.appendChild(sub);
        wrap.appendChild(card);
      });
    }

    function closeRecipeDetail() {
      selectedRecipeId = null;
      document.getElementById('detailCard').style.display = 'none';
      renderRecipes();
    }

    function toggleRecipe(id) {
      if (selectedRecipeId === id && document.getElementById('detailCard').style.display !== 'none') {
        closeRecipeDetail();
        return;
      }
      openRecipe(id, false);
    }

    function renderRatingPicker(currentRating) {
      const picker = document.getElementById('ratingPicker');
      picker.innerHTML = '';
      const activeVal = Number(currentRating || 0);

      for (let s = 1; s <= 5; s++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'star-btn' + (s <= activeVal ? ' active' : '');
        btn.textContent = s <= activeVal ? '★' : '☆';
        btn.title = `${s} Sterne`;
        btn.addEventListener('click', async () => {
          if (!selectedRecipeId) return;
          const nextRating = activeVal === s ? 0 : s;
          setBusy(true);
          try {
            state = await apiPostAction({
              action: 'setRating',
              recipeId: selectedRecipeId,
              rating: nextRating
            });
            openRecipe(selectedRecipeId, false);
            renderRecipes();
            setStatus(nextRating ? `Bewertung: ${nextRating} Sterne.` : 'Bewertung entfernt.', 'ok');
          } catch (err) {
            setStatus(err.message || 'Fehler bei Bewertung.', 'err');
          } finally {
            setBusy(false);
          }
        });
        picker.appendChild(btn);
      }
    }

    function openRecipe(id, scrollTop) {
      const r = state.recipes.find(item => item.id === id);
      if (!r) return;
      selectedRecipeId = r.id;

      document.getElementById('detailCard').style.display = 'block';
      document.getElementById('detailTitle').textContent = r.title;
      document.getElementById('detailMeta').textContent =
        `${r.servings} Portionen • ${r.durationMin} Min.` +
        (r.lastEaten ? ` • Zuletzt: ${r.lastEaten}` : '');

      const heroImg = document.getElementById('detailImage');
      if (r.imageUrl) {
        heroImg.src = r.imageUrl;
        heroImg.style.display = 'block';
        heroImg.onerror = () => { heroImg.style.display = 'none'; };
      } else {
        heroImg.style.display = 'none';
        heroImg.removeAttribute('src');
      }

      renderRatingPicker(r.rating);

      document.getElementById('detailIngredients').textContent = r.ingredients;
      document.getElementById('detailSteps').textContent = formatStepsWithSpacers(r.steps);
      document.getElementById('detailUrl').href = r.url || '#';
      document.getElementById('planServings').value = 3;
      if (!document.getElementById('planDate').value) {
        document.getElementById('planDate').value = toIsoDate(new Date());
      }

      renderRecipes();
      if (scrollTop) {
        document.getElementById('detailCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    document.getElementById('closeDetailBtn').addEventListener('click', closeRecipeDetail);
    document.getElementById('recipeSearch').addEventListener('input', renderRecipes);
    document.getElementById('starFilter').addEventListener('change', renderRecipes);

    async function loadData() {
      setBusy(true);
      setStatus('Lade Daten...');
      try {
        state = (await apiGetData()) || { recipes: [], plan: [] };
        renderPlan();
        renderRecipes();
        if (selectedRecipeId && state.recipes.some(r => r.id === selectedRecipeId)) {
          openRecipe(selectedRecipeId, false);
        } else {
          document.getElementById('detailCard').style.display = 'none';
        }
        setStatus('Bereit.', 'ok');
      } catch (err) {
        setStatus(err.message || 'Fehler beim Laden.', 'err');
      } finally {
        setBusy(false);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadData);

    document.getElementById('addBtn').addEventListener('click', async () => {
      const url = document.getElementById('recipeUrl').value.trim();
      const servings = document.getElementById('recipeServings').value || 3;
      if (!url) {
        setStatus('Bitte einen Rezept-Link eingeben.', 'err');
        return;
      }

      setBusy(true);
      setStatus('Analysiere Rezept...');
      try {
        state = await apiPostAction({ action: 'addRecipe', url, servings });
        document.getElementById('recipeUrl').value = '';
        document.getElementById('recipeServings').value = 3;
        renderPlan();
        renderRecipes();
        setStatus('Rezept gespeichert.', 'ok');
        switchView('recipesView');
      } catch (err) {
        setStatus(err.message || 'Fehler beim Analysieren.', 'err');
      } finally {
        setBusy(false);
      }
    });

    document.getElementById('planSaveBtn').addEventListener('click', async () => {
      if (!selectedRecipeId) return;
      const dateStr = document.getElementById('planDate').value;
      const servings = document.getElementById('planServings').value || 3;

      setBusy(true);
      try {
        state = await apiPostAction({
          action: 'planRecipe',
          recipeId: selectedRecipeId,
          dateStr,
          servings
        });
        renderPlan();
        renderRecipes();
        openRecipe(selectedRecipeId, false);
        setStatus('Im Essensplan eingetragen.', 'ok');
        switchView('planView');
      } catch (err) {
        setStatus(err.message || 'Fehler beim Planen.', 'err');
      } finally {
        setBusy(false);
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!selectedRecipeId) return;
      setBusy(true);
      try {
        state = await apiPostAction({ action: 'deleteRecipe', recipeId: selectedRecipeId });
        closeRecipeDetail();
        renderPlan();
        renderRecipes();
        setStatus('Rezept gelöscht.', 'ok');
      } catch (err) {
        setStatus(err.message || 'Fehler beim Löschen.', 'err');
      } finally {
        setBusy(false);
      }
    });

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
